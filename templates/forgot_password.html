{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="glass-panel" style="max-width: 500px; margin: 4rem auto; padding: 3rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <i data-feather="key" style="width: 48px; height: 48px; color: var(--accent-cyan); margin-bottom: 1rem;"></i>
            <h2>Reset Password</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem;">Enter your registered email address to verify your identity.</p>
        </div>
        
        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Enter your registered email" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem;">Verify Email</button>
        </form>
        
        <div style="text-align: center; margin-top: 2rem;">
            <a href="{{ url_for('login') }}" style="color: var(--accent-cyan); text-decoration: none; font-size: 0.9rem;">← Back to Login</a>
        </div>
        
        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.1); text-align: center;">
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem;">Still can't recover your account?</p>
            <a href="https://wa.me/2349132921718?text=Hello%20Admin,%20I%20need%20to%20reset%20my%20password." 
               style="color: #25D366; text-decoration: none; font-size: 0.9rem; font-weight: 600;">
                <i data-feather="message-circle" style="width: 14px; height: 14px; display: inline;"></i>
                Contact Admin via WhatsApp
            </a>
        </div>
    </div>
</div>
{% endblock %}
