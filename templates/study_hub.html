{% extends "base.html" %}

{% block content %}
<div class="container scale-up">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h2>Study Hub</h2>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">


        <!-- Flashcards Section -->
        <div class="glass-panel" style="padding: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3 style="display: flex; align-items: center; gap: 0.5rem;"><i data-feather="layers" style="color: var(--accent-cyan);"></i> Flashcards</h3>
                <button onclick="document.getElementById('flashcard-modal').style.display='block'" class="btn btn-outline" style="padding: 0.4rem 1rem;">+ Create Deck</button>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                {% for deck in decks %}
                    <div style="background: rgba(0,0,0,0.2); padding: 1rem; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <h4 style="margin-bottom: 0.25rem;">{{ deck.title }}</h4>
                            <span style="font-size: 0.85rem; color: var(--text-muted);">{{ deck.cards|length }} Cards • {{ deck.created_at.strftime('%b %d') }}</span>
                        </div>
                        <a href="{{ url_for('view_flashcards', deck_id=deck.id) }}" class="btn btn-primary" style="padding: 0.4rem 1rem;">Study</a>
                    </div>
                {% else %}
                    <p style="color: var(--text-muted); text-align: center; padding: 2rem 0;">No flashcard decks yet.</p>
                {% endfor %}
            </div>
        </div>


    </div>
</div>

<!-- Simple Modals (Hidden by default) -->
<div id="flashcard-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; padding: 4rem;">
    <div class="glass-panel" style="max-width: 600px; margin: 0 auto; padding: 2rem; max-height: 80vh; overflow-y: auto;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
            <h3>Create Flashcard Deck</h3>
            <button onclick="document.getElementById('flashcard-modal').style.display='none'" class="btn btn-outline" style="border: none;">X</button>
        </div>
        <form method="POST" action="{{ url_for('create_flashcard_deck') }}">
            <div class="form-group"><input type="text" name="title" class="form-control" placeholder="Deck Title" required></div>
            <div id="cards-container">
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <textarea name="front_text[]" class="form-control" placeholder="Front (Term)" required></textarea>
                    <textarea name="back_text[]" class="form-control" placeholder="Back (Definition)" required></textarea>
                </div>
            </div>
            <button type="button" class="btn btn-outline" onclick="addCard()" style="margin-bottom: 1.5rem; width: 100%;">+ Add Another Card</button>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Save Deck</button>
        </form>
    </div>
</div>


<script>
    function addCard() {
        const container = document.getElementById('cards-container');
        container.insertAdjacentHTML('beforeend', `
            <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                <textarea name="front_text[]" class="form-control" placeholder="Front (Term)" required></textarea>
                <textarea name="back_text[]" class="form-control" placeholder="Back (Definition)" required></textarea>
            </div>
        `);
    }

</script>
{% endblock %}
