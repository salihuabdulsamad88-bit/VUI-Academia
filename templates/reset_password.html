{% extends "base.html" %}

{% block content %}
<div class="auth-container fade-in">
    <div class="auth-card glass-panel">
        <h2 style="text-align: center; margin-bottom: 2rem;">Reset Password</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Security Question for <strong>{{ user.full_name }}</strong>:</p>
        
        <div style="background: rgba(255,255,255,0.05); padding: 1.5rem; border-radius: 8px; margin-bottom: 2rem; border-left: 4px solid var(--accent-cyan);">
            <p style="font-weight: 500;">{{ user.security_question }}</p>
        </div>

        <form method="POST" action="{{ url_for('reset_password', user_id=user.id) }}">
            <div class="form-group">
                <label class="form-label">Your Answer</label>
                <input type="text" name="answer" class="form-control" placeholder="Type your answer here" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" name="new_password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; margin-top: 1rem;">Update Password</button>
        </form>
    </div>
</div>
{% endblock %}
