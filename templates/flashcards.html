{% extends "base.html" %}

{% block content %}
<div class="container scale-up" style="display: flex; flex-direction: column; align-items: center;">
    
    <div style="width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
        <h2>{{ deck.title }}</h2>
        <a href="{{ url_for('study_hub') }}" class="btn btn-outline">Back to Hub</a>
    </div>

    <div class="flashcard-container" style="width: 100%; max-width: 600px; height: 400px; perspective: 1000px; cursor: pointer;">
        <div id="flashcard" class="flashcard-inner" style="width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d;" onclick="this.classList.toggle('is-flipped')">
            
            <div class="flashcard-front glass-panel" style="position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 2rem; font-size: 1.5rem; text-align: center; border: 2px solid rgba(255,255,255,0.1);">
                <span id="card-front-text">Loading...</span>
                <span style="position: absolute; bottom: 1rem; font-size: 0.8rem; color: var(--text-muted);">Click to flip</span>
            </div>
            
            <div class="flashcard-back glass-panel" style="position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 2rem; font-size: 1.2rem; text-align: center; background: rgba(37, 99, 235, 0.1); border: 2px solid var(--accent-blue); transform: rotateY(180deg);">
                <span id="card-back-text">Loading...</span>
            </div>
            
        </div>
    </div>
    
    <div style="display: flex; gap: 1rem; margin-top: 2rem; align-items: center;">
        <button class="btn btn-outline" onclick="prevCard()"><i data-feather="arrow-left"></i> Previous</button>
        <span id="card-counter" style="color: var(--text-muted); font-weight: 600;">0 / 0</span>
        <button class="btn btn-outline" onclick="nextCard()">Next <i data-feather="arrow-right"></i></button>
    </div>

</div>

<style>
    .flashcard-inner.is-flipped {
        transform: rotateY(180deg);
    }
</style>

<script>
    const cards = [
        {% for card in deck.cards %}
        {
            front: {{ card.front_text | tojson | safe }},
            back: {{ card.back_text | tojson | safe }}
        }{% if not loop.last %},{% endif %}
        {% endfor %}
    ];
    let currentIndex = 0;

    function updateCard() {
        if(cards.length === 0) {
            document.getElementById('card-front-text').textContent = "No cards in this deck.";
            document.getElementById('card-back-text').textContent = "No cards in this deck.";
            return;
        }
        
        // Briefly remove the flip class so we start on the front side
        const flashcard = document.getElementById('flashcard');
        const wasFlipped = flashcard.classList.contains('is-flipped');
        
        if (wasFlipped) {
            flashcard.classList.remove('is-flipped');
            // Wait for flip animation to finish halfway before swapping text
            setTimeout(setCardText, 250);
        } else {
            setCardText();
        }
    }

    function setCardText() {
        document.getElementById('card-front-text').textContent = cards[currentIndex].front;
        document.getElementById('card-back-text').textContent = cards[currentIndex].back;
        document.getElementById('card-counter').textContent = `${currentIndex + 1} / ${cards.length}`;
    }

    function nextCard() {
        if (currentIndex < cards.length - 1) {
            currentIndex++;
            updateCard();
        }
    }

    function prevCard() {
        if (currentIndex > 0) {
            currentIndex--;
            updateCard();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        updateCard();
    });
</script>
{% endblock %}
